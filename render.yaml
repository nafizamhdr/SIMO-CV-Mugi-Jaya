# ============================================================
# SIMO — Render Blueprint (backend)
# Deploy: Render Dashboard -> New -> Blueprint -> pilih repo ini.
# Database memakai Neon (connection string diisi manual di DATABASE_URL).
# ============================================================
services:
  - type: web
    name: simo-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # isi manual: connection string Neon (akhiri ?sslmode=require)
      - key: FRONTEND_URL
        sync: false # isi manual: domain Vercel (boleh banyak, dipisah koma)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
